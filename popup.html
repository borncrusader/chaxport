<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 300px;
            padding: 20px;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
        }

        h2 {
            margin: 0 0 15px 0;
            font-size: 18px;
            color: #333;
        }

        #exportButton {
            width: 100%;
            padding: 12px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
        }

        #exportButton:hover {
            background-color: #2563eb;
        }

        #notSupported {
            color: #666;
            font-size: 14px;
            text-align: center;
            padding: 10px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <h2>Chaxport</h2>
    <div id="supportedSite" class="hidden">
        <button id="exportButton">Print View</button>
    </div>
    <div id="notSupported" class="hidden">
        This site is not supported. Chaxport currently only works on claude.ai.
    </div>
    <script src="popup.js"></script>
</body>
</html>
